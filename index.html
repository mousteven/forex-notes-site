<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>外匯研究筆記</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#F4F6F8;--card:#fff;--fg:#1B2430;--sub:#5A6878;--line:#DDE3EA;--acc:#0057B8;--ok:#1E7B4A;--rbg:#FDECEA;--rfg:#9B1C1C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11161C;--card:#1A222B;--fg:#E6ECF2;--sub:#9AA8B6;--line:#2A3540;--acc:#6FA8FF;--ok:#5CC98C;--rbg:#3A1A1A;--rfg:#FFB4B4;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Noto Sans TC",system-ui,sans-serif;padding:24px 16px}
main{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
img{max-width:100%}.rd img{border-radius:8px;margin-top:4px}
h1{font-size:22px;margin:0}
.sub{color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums}
form{display:grid;gap:12px;background:var(--card);padding:24px;border-radius:12px}
input,button{font:inherit;min-height:48px;border-radius:8px;padding:0 12px}
input{border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{border:0;background:var(--acc);color:#fff;font-weight:700}
#err{color:#D3322C;min-height:1.5em;margin:0}
details{background:var(--card);border-radius:12px;padding:12px 16px}
summary{cursor:pointer;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;min-height:32px}
summary b{font-variant-numeric:tabular-nums;color:var(--sub);min-width:2ch}
.tag{font-size:14px;color:var(--sub)}.tag.ok{color:var(--ok);font-weight:700}
.md{overflow-wrap:anywhere}.md h1{font-size:18px}
pre{white-space:pre-wrap;font-size:14px;max-height:60vh;overflow:auto;background:var(--bg);padding:12px;border-radius:8px}
a{color:var(--acc)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
.chip{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:15px;display:flex;gap:8px;align-items:center}
.chip i{font-style:normal;font-size:20px}
ol.steps{margin:8px 0;padding-left:0;list-style:none;display:grid;gap:8px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
ol.steps li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.risk{background:var(--rbg);color:var(--rfg);border-radius:8px;padding:12px;font-weight:700}
figure{margin:12px 0}figure img{width:100%;border-radius:8px;display:block;background:var(--bg);min-height:60px}
figcaption{font-size:14px;color:var(--sub);margin-top:4px}
.verdict{border-left:4px solid var(--acc);padding:4px 12px;font-weight:700}
.sec{font-size:17px;margin:20px 0 8px}
.rd{display:grid;gap:4px;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px}
.rd .tm{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700}
.rd span{font-size:15px}.rd b{color:var(--sub);font-weight:400;font-size:14px;margin-right:4px}
ul.copy{padding-left:20px;display:grid;gap:6px;margin:0}
.recap{border-left:3px solid var(--line);padding-left:12px;margin:0 0 8px}
.chart text{fill:var(--sub);font-size:11px}
.tv h3{font-size:16px;margin:20px 0 8px}
.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mv{background:var(--bg);border-radius:8px;padding:12px;display:grid;gap:4px}
.mv i{font-style:normal;font-size:28px}.mv b{font-size:16px}.mv span{font-size:14px;color:var(--sub)}
.arrow{color:var(--sub);text-align:center;font-size:14px}
svg{width:100%;height:auto;display:block;max-width:520px}

</style></head><body><main>

function dec(b){return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12))}
async function img(el){
  var b=new Uint8Array(await (await fetch(el.dataset.src)).arrayBuffer());
  el.src=URL.createObjectURL(new Blob([await dec(b)],{type:'image/jpeg'}));
}
// 每部自己的示意圖：座標直接用 360x230 畫布，資料在圖卡 JSON 的 diagram
var COL={g:'#2E9E62',r:'#D3322C',b:'#3D7FD9',o:'#E8A33D',f:'currentColor'};
function diagram(d){
  if(!d)return '';
  var h='<svg viewBox="0 0 360 230" role="img" aria-label="'+esc(d.title)+'">';
  (d.bands||[]).forEach(function(x){h+='<rect x="0" y="'+x.y1+'" width="360" height="'+(x.y2-x.y1)+'" rx="6" fill="'+COL[x.c]+'" fill-opacity=".14"/><text x="6" y="'+(x.y1+15)+'" font-size="12" fill="currentColor">'+esc(x.label)+'</text>'});
  (d.lines||[]).forEach(function(x){h+='<line x1="'+(x.x1||0)+'" y1="'+x.y1+'" x2="'+(x.x2||360)+'" y2="'+(x.y2==null?x.y1:x.y2)+'" stroke="'+COL[x.c]+'" stroke-width="2"'+(x.dash?' stroke-dasharray="5 4"':'')+'/>'+(x.label?'<text x="'+(x.lx||x.x2||360)+'" y="'+(x.ly||x.y1-4)+'" font-size="12" text-anchor="end" fill="'+COL[x.c]+'">'+esc(x.label)+'</text>':'')});
  h+='<polyline points="'+d.path.map(function(p){return p.join(',')}).join(' ')+'" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>';
  (d.marks||[]).forEach(function(m){h+='<circle cx="'+m[0]+'" cy="'+m[1]+'" r="'+(m[4]||5)+'" fill="'+COL[m[3]||'b']+'"/>'+(m[2]?'<text x="'+m[0]+'" y="'+(m[1]+(m[5]||-9))+'" font-size="12" text-anchor="middle" fill="currentColor">'+esc(m[2])+'</text>':'')});
  (d.notes||[]).forEach(function(n){h+='<text x="'+n[0]+'" y="'+n[1]+'" font-size="12" font-weight="700" text-anchor="'+(n[3]||'start')+'" fill="'+COL[n[4]||'f']+'">'+esc(n[2])+'</text>'});
  return h+'</svg><p class="sub">'+esc(d.title)+'</p>';
}
function posChart(p){
  var W=340,L=34,R=8,n=p[p.length-1][0]||1,maxL=Math.max.apply(null,p.map(function(x){return x[1]}))||1,minU=Math.min.apply(null,p.map(function(x){return x[2]}))||-1;
  var x=function(m){return L+(W-L-R)*m/n},bw=Math.max(1,(W-L-R)/n-1);
  var h='<svg class="chart" viewBox="0 0 '+W+' 210" role="img" aria-label="每分鐘掛幾口與帳面浮動">';
  h+='<text x="0" y="12">口數</text><text x="0" y="28">'+maxL+'</text><text x="0" y="92">0</text>';
  p.forEach(function(q){var hh=78*q[1]/maxL;h+='<rect x="'+x(q[0])+'" y="'+(90-hh)+'" width="'+bw+'" height="'+hh+'" fill="#3D7FD9"/>'});
  h+='<line x1="'+L+'" y1="120" x2="'+(W-R)+'" y2="120" stroke="currentColor" stroke-opacity=".3"/>';
  h+='<text x="0" y="112">浮動</text><text x="0" y="124">0</text><text x="0" y="200">'+Math.round(minU)+'</text>';
  h+='<polyline fill="none" stroke="#D3322C" stroke-width="2" points="'+p.map(function(q){return x(q[0])+','+(120+75*q[2]/minU)}).join(' ')+'"/>';
  var st=n>90?30:10;for(var m=0;m<=n;m+=st)h+='<text x="'+(x(m)-6)+'" y="210">'+m+'分</text>';
  return h+'</svg>';
}
function thesisVisual(t){
  if(!t)return '';
  var h='<div class="tv"><h3>🧰 他的固定設定（每一場都一樣）</h3><div class="chips">'+t.params.map(function(x){return '<div class="chip"><i>'+x[0]+'</i>'+esc(x[1])+'</div>'}).join('')+'</div>';
  // 分區圖：價格往下，部位往右變大
  var z=t.zones;
  h+='<h3>🗺 部位分區：跌越深，能用的口數越多，但有天花板和地板</h3><svg viewBox="0 0 360 260" role="img" aria-label="部位分區圖">'+
   '<rect x="0" y="10" width="360" height="80" rx="6" fill="#3D7FD9" fill-opacity=".14"/><text x="10" y="32" font-size="13" font-weight="700" fill="currentColor">Y</text><text x="28" y="32" font-size="13" fill="currentColor">'+esc(z.setup)+'</text>'+
   
   '<rect x="10" y="62" width="120" height="16" rx="3" fill="#3D7FD9"/><text x="136" y="75" font-size="13" fill="currentColor">≈ 6 口</text>'+
   '<line x1="0" y1="96" x2="360" y2="96" stroke="#D3322C" stroke-width="2"/><text x="250" y="110" font-size="12" fill="#D3322C">準備區邊界</text>'+
   '<rect x="0" y="116" width="360" height="80" rx="6" fill="#E8A33D" fill-opacity=".16"/><text x="10" y="138" font-size="13" font-weight="700" fill="currentColor">X</text><text x="28" y="138" font-size="13" fill="currentColor">'+esc(z.fix)+'</text>'+
   '<rect x="10" y="168" width="120" height="16" rx="3" fill="#E8A33D"/><text x="136" y="181" font-size="13" fill="currentColor">再 ≈ 6 口（合計 12）</text>'+
   '<line x1="0" y1="214" x2="360" y2="214" stroke="#D3322C" stroke-width="3" stroke-dasharray="6 4"/>'+
   '<text x="10" y="236" font-size="13" font-weight="700" fill="#D3322C">⛔ '+esc(z.floor)+'</text>'+
   '<text x="10" y="254" font-size="12" fill="currentColor" fill-opacity=".7">$51,000 帳戶 5% ≈ −$2,550，約他 12 場的獲利</text></svg>';
  if(t.stats)h+='<h3>📊 他自己給的統計</h3><div class="chips">'+t.stats.map(function(x){return '<div class="chip"><i>'+x[0]+'</i>'+esc(x[1])+'</div>'}).join('')+'</div>';
  if(t.modes)h+='<h3>🔀 兩種單</h3><div class="moves">'+t.modes.map(function(m){return '<div class="mv"><i>'+m[0]+'</i><b>'+esc(m[1])+'</b><span>'+esc(m[2])+'</span></div>'}).join('')+'</div>';
  h+='<h3>🧯 被套時的三招（由輕到重）</h3><div class="moves">'+t.moves.map(function(m,i){return '<div class="mv"><i>'+m[0]+'</i><b>'+(i+1)+'. '+esc(m[1])+'</b><span>'+esc(m[2])+'</span></div>'}).join('')+'</div>';
  // 每場：賺多少（綠）vs 中途最多虧多少（紅），同一把尺
  var mx=Math.max.apply(null,t.sessions.map(function(x){return x[2]})),W=360,L=118,sc=(W-L-72)/mx,fm=function(v){return v.toLocaleString('en-US')};
  h+='<h3>⚖️ 每一場：最後賺多少 vs 中途最多虧多少</h3><svg class="chart" viewBox="0 0 '+W+' '+(t.sessions.length*52+20)+'" role="img" aria-label="每場獲利與最大帳面虧損">';
  t.sessions.forEach(function(x,i){var y=i*52+10;
   h+='<text x="0" y="'+(y+14)+'" style="font-size:12px">'+esc(x[0])+'</text><text x="0" y="'+(y+30)+'" style="font-size:11px">最多 '+x[3]+' 口</text>'+
    '<rect x="'+L+'" y="'+y+'" width="'+(x[1]*sc)+'" height="16" rx="3" fill="#2E9E62"/><text x="'+(L+x[1]*sc+4)+'" y="'+(y+13)+'" style="font-size:12px">+$'+fm(x[1])+'</text>'+
    '<rect x="'+L+'" y="'+(y+20)+'" width="'+(x[2]*sc)+'" height="16" rx="3" fill="#D3322C"/><text x="'+(L+x[2]*sc+4)+'" y="'+(y+33)+'" style="font-size:12px">−$'+fm(x[2])+'</text>'});
  h+='</svg><p class="sub">綠＝最後賺到的錢；紅＝中途帳面最多倒虧多少。紅的都比綠的長：要撐得住才拿得到。4/15 那條紅色比其他場長約 20 倍，是爆掉時的樣子。</p>';
  h+='<h3>📋 鐵律</h3><ul class="copy">'+t.rules.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
  h+='<h3>❓ 還在找答案</h3><ul class="copy">'+t.open.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
  return h;
}
function card(c){
  if(!c)return '';
  var h='<div class="chips">'+c.chips.map(function(x){return '<div class="chip"><i>'+x[0]+'</i>'+esc(x[1])+'</div>'}).join('')+'</div>';
  h+=diagram(c.diagram);
  h+='<ol class="steps">'+c.steps.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>';
  h+='<p class="risk">⚠️ '+esc(c.risk)+'</p>';
  h+=c.frames.filter(function(f){return f.src}).map(function(f){return '<figure><img alt="" data-src="'+f.src+'"><figcaption>'+f.t+'　'+esc(f.cap)+'</figcaption></figure>'}).join('');
  if(c.copy)h+='<h3 class="sec">📋 照著做的規則</h3><ul class="copy">'+c.copy.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
  if(c.pos)h+='<h3 class="sec">📦 他怎麼配置部位（每分鐘）</h3>'+posChart(c.pos)+'<ul class="copy">'+c.pos_note.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
  if(c.reads)h+='<h3 class="sec">🕯 他怎麼讀 K 線</h3>'+c.reads.map(function(r){return '<div class="rd"><span class="tm">'+r.t+'</span><span><b>看到</b>'+esc(r.see)+'</span><span><b>解讀</b>'+esc(r.mean)+'</span><span><b>動作</b>'+esc(r.do)+'</span>'+(r.src?'<img alt="" data-src="'+r.src+'">':'')+'</div>'}).join('');
  if(c.recap)h+='<h3 class="sec">🎙 老師自己的總結</h3>'+c.recap.map(function(r){return '<p class="recap"><span class="tm">'+r[0]+'</span>　'+esc(r[1])+'</p>'}).join('');
  return h+'<p class="verdict">'+esc(c.verdict)+'</p>';
}
function render(d){
  var nt=d.items.filter(function(x){return x.tr}).length,nn=d.items.filter(function(x){return x.note}).length;
  var h='<p class="sub">更新 '+d.at+'　逐字稿 '+nt+'/'+d.items.length+'　已整理 '+nn+'/'+d.items.length+'</p>';
  h+='<details open><summary>🧭 目前的總論點</summary>'+thesisVisual(d.tv)+'<details><summary>文字版（含修訂紀錄）</summary><div class="md">'+marked.parse(d.thesis)+'</div></details></details>';
  h+='<details><summary><b>0</b>第 1 部 Trading Room 2019/03/28<span class="tag ok">已整理</span></summary>'+card(d.first_card)+'<details><summary>完整整理</summary><div class="md">'+marked.parse(d.first)+'</div></details></details>';
  d.items.forEach(function(x){
    var tag=x.note?'<span class="tag ok">已整理</span>':x.tr?'<span class="tag">逐字稿好了</span>':'<span class="tag">排隊中</span>';
    h+='<details><summary><b>'+x.n+'</b>'+esc(x.title)+' <span class="tag">'+x.dur+'</span>'+tag+'</summary>'+
      card(x.card)+
      (x.note?(x.card?'<details><summary>完整整理</summary><div class="md">'+marked.parse(x.note)+'</div></details>':'<div class="md">'+marked.parse(x.note)+'</div>'):'')+
      (x.tr?'<details><summary>逐字稿</summary><pre>'+esc(x.tr)+'</pre></details>':'')+
      '<p><a href="'+x.url+'" target="_blank" rel="noopener">YouTube 原片</a></p></details>';
  });
  var o=document.getElementById('out');o.innerHTML=h;o.querySelectorAll('main>div>details').forEach(function(d){d.addEventListener('toggle',function(){if(d.open)d.querySelectorAll('img[data-src]:not([src])').forEach(img)})});o.hidden=false;document.getElementById('f').hidden=true;
}
async function go(pw,quiet){
  try{var d=await open_(pw);try{localStorage.setItem('pw',pw)}catch(e){}render(d)}
  catch(e){if(!quiet)document.getElementById('err').textContent='密碼不對'}
}
document.getElementById('f').onsubmit=function(e){e.preventDefault();document.getElementById('err').textContent='解鎖中…';go(document.getElementById('pw').value)};
try{var s=localStorage.getItem('pw');if(s)go(s,true)}catch(e){}
</script></body></html>
